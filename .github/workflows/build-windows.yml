name: Build unsigned Windows executable
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements and packager
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Build TakePath
        run: pyinstaller --noconfirm --clean --windowed --name TakePath --icon assets/takepath.ico --add-data "assets;assets" --add-data "examples;examples" --collect-all uiautomation main.py
      - uses: actions/upload-artifact@v4
        with:
          name: TakePath-Windows-unsigned
          path: dist/TakePath/
          if-no-files-found: error
