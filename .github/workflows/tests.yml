name: Core tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Python Core Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install Pillow

      - name: Check Python syntax
        run: |
          python -m compileall -q action_studio main.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

  windows-editor:
    name: Windows Editor Interaction Tests
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt Pillow
      - name: Run actual Qt editor interaction tests
        run: python -m unittest discover -s tests -p "test_wait_editor_gui_v12.py" -v
